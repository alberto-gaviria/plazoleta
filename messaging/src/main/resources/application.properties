server.port=8082
spring.application.name=messaging-service

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=messaging_db
spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890123456789012345678901234567890}

logging.level.com.plazoleta.messaging=DEBUG
logging.level.com.twilio=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

notification.sms.retry-attempts=3
notification.sms.timeout-seconds=30