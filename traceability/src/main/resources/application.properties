server.port=8083
server.servlet.context-path=/api/v1

spring.application.name=traceability-service

spring.data.mongodb.uri=mongodb://localhost:27017/traceability_db
spring.data.mongodb.database=traceability_db
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy

jwt.secret=mySecretKey123456789012345678901234567890123456789012345678901234567890
jwt.expiration=86400000

management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=when-authorized

logging.level.com.plazoleta.traceability=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

spring.jackson.deserialization.fail-on-unknown-properties=true

traceability.service.url=http://localhost:8083/api/v1
traceability.service.timeout=30000
traceability.service.retry.attempts=3

feign.client.config.traceability-service.connect-timeout=10000
feign.client.config.traceability-service.read-timeout=30000

spring.cloud.compatibility-verifier.enabled=false