server.port=8081
spring.application.name=restaurants-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/plazoleta_db
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Actuator
management.endpoints.web.exposure.include=health,info

# Configuración de Feign para comunicación con otros microservicios
feign.users.url=http://localhost:8080